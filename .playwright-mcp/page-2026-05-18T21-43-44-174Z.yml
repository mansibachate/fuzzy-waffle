      - generic [ref=e80]: BRAND BUILDER
      - heading "Biography" [level=2] [ref=e81]
      - paragraph [ref=e82]: I'm Mansi Bachate. Someone who is genuinely hard to put in a box, and I made peace with that a long time ago.
      - paragraph [ref=e83]: I graduated with a double major in Finance and Business Data Analytics from ASU's W. P. Carey School of Business. But along the way, I also competed at Femina Miss India 2026, walked the New York Fashion Week runway, and built my own brand from the ground up. Not because someone told me I could do it all. Because I was never willing to choose just one thing.
      - paragraph [ref=e84]: I am not scared of going after what I want, even when the path looks unconventional. I'm a hustler in the truest sense. Whether I'm managing $100M+ budgets at Intel or stepping in front of a camera, I give it everything I have. I go to whatever lengths it takes to get my work done right. That has been my north star from the very beginning, and it is not going to change.
