      - generic [ref=e78]: BRAND BUILDER
      - heading "Biography" [level=2] [ref=e79]
      - paragraph [ref=e80]: I'm Mansi Bachate — someone who's genuinely hard to put in a box. And honestly, I've stopped trying.
      - paragraph [ref=e81]: By training, I'm a financial analyst with a double major in Finance and Business Data Analytics from ASU's W. P. Carey School of Business. By passion, I've competed on national stages, walked international runways, and built my own brand from the ground up.
      - paragraph [ref=e82]: What drives me isn't a job title. It's the feeling of getting better at something I truly love. I understand how data works. I also understand how a brand should feel. That combination is rare — and it's exactly what I bring.
